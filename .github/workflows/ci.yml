name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.140.2'

      - name: Build the starter site from the sample tree
        run: ./starter/build.sh "$PWD/tests/fixtures/sample.ged"

      # The sample tree contains people who must never be published. If any of
      # their names reach the output, the privacy filter has regressed.
      - name: Privacy regression check
        run: |
          if grep -rEl "Peter Lund|Frances Lund|Joan Kirkby|George Lund|Parkin" starter/public; then
            echo "::error::Withheld people appear in the built site"
            exit 1
          fi

      # The credit always links to the project. The author's name links only if the
      # site sets authorUrl, so the starter's blank placeholder must leave it plain.
      - name: Footer links check
        run: |
          grep -q 'Compiled by Your Name\. Built with <a href=https://github.com/ianfnelson/gedcom-hugo>gedcom-hugo</a>' starter/public/index.html
          HUGO_PARAMS_AUTHORURL=https://example.org/me hugo --source starter --minify --destination "$RUNNER_TEMP/linked"
          grep -q 'Compiled by <a href=https://example.org/me>Your Name</a>\.' "$RUNNER_TEMP/linked/index.html"

      # The sample tree has later CHAN dates on a withheld person, a family with a
      # withheld child and a source only withheld people cite, and a later export date.
      # If any of them moves this date, edits to living people are showing through.
      - name: Last updated check
        run: |
          grep -q '"last_updated": "2024-03-12T18:40:12"' starter/_generated/data/site.json
          grep -q 'updated 12 March 2024' starter/public/index.html

      # I3's date comes from its family. I8's only CHAN is on a family with a withheld
      # child, so it must have no date, or an edit to a living person is showing through.
      - name: Person last updated check
        run: |
          grep -q '"updated": "2024-03-12T18:40:12"' starter/_generated/content/people/i3.md
          grep -q 'This page last updated 12 March 2024' starter/public/people/i3/index.html
          grep -q '<lastmod>2024-03-12T18:40:12' starter/public/sitemap.xml
          grep -q 'Recently updated' starter/public/index.html
          if grep -q '"updated"' starter/_generated/content/people/i8.md; then
            echo "::error::A family with a withheld member moved a person's date"
            exit 1
          fi

      # Hugo silently drops a page published in the future, and lastmod sets that date.
      # Rebuilds the site, so keep this after the checks on the sample tree.
      - name: Future change date check
        run: |
          sed 's/^2 DATE 12 MAR 2024/2 DATE 12 MAR 2099/' tests/fixtures/sample.ged > "$RUNNER_TEMP/future.ged"
          ./starter/build.sh "$RUNNER_TEMP/future.ged"
          test -f starter/public/people/i1/index.html

  # Rebuilds the private site whenever the converter changes. Needs a repository
  # variable SITE_REPOSITORY (e.g. owner/family-tree) and a secret SITE_DISPATCH_TOKEN:
  # a fine-grained token with Contents: read & write on that one repository.
  notify-site:
    needs: build
    if: github.event_name == 'push' && vars.SITE_REPOSITORY != ''
    runs-on: ubuntu-latest
    steps:
      - name: Trigger site rebuild
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: gh api "repos/${{ vars.SITE_REPOSITORY }}/dispatches" -f event_type=converter-updated
